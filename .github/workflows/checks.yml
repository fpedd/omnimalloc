name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.10"
  # TODO(fpedd): Make minimalloc more easily installable via PyPI
  MINIMALLOC_URL: "git+https://github.com/google/minimalloc.git"
  # Force matplotlib's non-interactive backend; runners lack a working Tcl/Tk.
  MPLBACKEND: Agg

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pre-commit run --all-files

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # Example 01 must work without the extras
      - run: uv sync
      - run: uv run python examples/01_basic.py
      # Examples 02 to 04 need them
      - run: uv sync --all-extras
      - run: uv pip install ${{ env.MINIMALLOC_URL }}
      - run: uv run python examples/02_plotting.py
      - run: uv run python examples/03_allocators.py
      - run: uv run python examples/04_sources.py

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      UV_PYTHON: ${{ matrix.python-version }} # outranks .python-version, which pins 3.10
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux, plus one job per additional platform
        # the wheels are built for (keep in sync with build.yml).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv pip install ${{ env.MINIMALLOC_URL }}
        if: runner.os == 'Linux'
      # Gate coverage only where every optional path runs: Hub rate limits and
      # the Linux-only minimalloc install starve the other legs of statements
      - run: >
          uv run pytest -v
          ${{ matrix.os == 'ubuntu-latest'
          && matrix.python-version == env.DEFAULT_PYTHON
          && '--cov=omnimalloc --cov-fail-under=90 --cov-report=term-missing'
          || '' }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv build

  # TODO(fpedd): This job currently doesn't actually fail/error on quality issues.
  # We should act on that. But for now, it's useful to have the reports in CI.
  cpp-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy iwyu
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: CMAKE_ARGS="-DENABLE_CLANG_TIDY=ON -DENABLE_IWYU=ON" uv build

  checks-status:
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, examples, test, build, cpp-quality]
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
